<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo redondeado navy -->
  <rect width="32" height="32" rx="7" fill="#0A192F"/>

  <!-- Barras ascendentes (izq → der) -->
  <rect x="4"  y="21" width="6" height="7"  rx="1.5" fill="#10B981"/>
  <rect x="13" y="14" width="6" height="14" rx="1.5" fill="#10B981"/>
  <rect x="22" y="7"  width="6" height="21" rx="1.5" fill="#10B981"/>

  <!-- Línea de tendencia sobre las barras -->
  <polyline
    points="7,21 16,14 25,7"
    stroke="rgba(255,255,255,0.45)"
    stroke-width="1.5"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
